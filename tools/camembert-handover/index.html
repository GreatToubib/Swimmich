<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<title>File des camemberts</title>

<style>
  :root {
    --paper:      #F7F5F0;
    --surface:    #FFFFFF;
    --surface-2:  #EFEBE1;
    --line:       #DED7C7;
    --line-soft:  #E9E4D8;
    --ink:        #1C1B17;
    --muted:      #6E695C;
    --gold:       #B8841B;
    --gold-soft:  #F2E3BC;
    --rail:       #2E4A7D;
    --paid:       #3C7550;
    --paid-soft:  #DEEBE0;
    --on-paid:    #FFFFFF;
    --due:        #A93F2B;
    --due-soft:   #F6DFD8;
    --late:       #96590C;
    --late-soft:  #F7E7CE;
    --shadow-1:   0 1px 1px rgba(28,27,23,.05), 0 2px 6px rgba(28,27,23,.06);
    --shadow-2:   0 10px 30px rgba(28,27,23,.20), 0 2px 6px rgba(28,27,23,.12);

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

    --r: 12px;
    --pad: 14px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:     #14130F;
      --surface:   #1D1B16;
      --surface-2: #26241C;
      --line:      #38352B;
      --line-soft: #2C2A22;
      --ink:       #F0EBDE;
      --muted:     #9D9687;
      --gold:      #E0AE4C;
      --gold-soft: #3B3014;
      --rail:      #94ADD8;
      --paid:      #7CBB8B;
      --paid-soft: #1D2E22;
      --on-paid:   #12210F;
      --due:       #E08A6F;
      --due-soft:  #33201A;
      --late:      #E3B072;
      --late-soft: #33260F;
      --shadow-1:  0 1px 1px rgba(0,0,0,.30), 0 2px 6px rgba(0,0,0,.28);
      --shadow-2:  0 10px 30px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --paper:     #14130F;
    --surface:   #1D1B16;
    --surface-2: #26241C;
    --line:      #38352B;
    --line-soft: #2C2A22;
    --ink:       #F0EBDE;
    --muted:     #9D9687;
    --gold:      #E0AE4C;
    --gold-soft: #3B3014;
    --rail:      #94ADD8;
    --paid:      #7CBB8B;
    --paid-soft: #1D2E22;
    --on-paid:   #12210F;
    --due:       #E08A6F;
    --due-soft:  #33201A;
    --late:      #E3B072;
    --late-soft: #33260F;
    --shadow-1:  0 1px 1px rgba(0,0,0,.30), 0 2px 6px rgba(0,0,0,.28);
    --shadow-2:  0 10px 30px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; }

  /* sans ceci, un display: flex explicite l'emporte sur l'attribut hidden */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  body.is-dragging { touch-action: none; user-select: none; -webkit-user-select: none; }

  .app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- bandeau ---------- */

  .top {
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 12px var(--pad) 10px;
  }

  .masthead { display: flex; align-items: flex-start; gap: 10px; }

  .wheel {
    flex: none;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--gold-soft);
    border: 2px solid var(--gold);
    position: relative;
    margin-top: 2px;
  }
  .wheel::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 200deg, var(--gold) 0 46deg, transparent 46deg 360deg);
    opacity: .55;
  }

  .masthead h1 {
    margin: 0;
    font-size: 20px;
    line-height: 1.05;
    letter-spacing: .01em;
    font-weight: 800;
    text-transform: uppercase;
    text-wrap: balance;
  }

  .eyebrow {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }

  .tally {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
  }
  .tally span {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .tally b { font-size: 15px; font-weight: 700; }
  .tally i { font-style: normal; color: var(--muted); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
  .tally .t-paid b { color: var(--paid); }
  .tally .t-due  b { color: var(--due); }

  .readonly-flag {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
    padding: 8px 10px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .readonly-flag b {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--rail);
  }

  /* ---------- réglages ---------- */

  .cfg-toggle {
    margin-top: 8px;
    width: 100%;
    background: none;
    border: 0;
    padding: 4px 0 0;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
  }
  .cfg-toggle .caret { transition: transform .2s ease; }
  .cfg-toggle[aria-expanded="true"] .caret { transform: rotate(180deg); }

  .cfg {
    display: grid;
    gap: 10px;
    padding: 12px;
    margin-top: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
  }
  .cfg[hidden] { display: none; }
  .cfg-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .cfg-row label { font-size: 13px; color: var(--muted); }
  .cfg input, .cfg select {
    font-family: var(--mono);
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 9px;
    min-width: 104px;
    text-align: center;
  }
  .cfg hr { border: 0; border-top: 1px solid var(--line); margin: 2px 0; }
  .cfg-actions { display: grid; gap: 8px; }

  /* ---------- tableau ---------- */

  .board { flex: 1; padding: 8px var(--pad) 4px; }

  .slot { display: grid; grid-template-columns: 62px 1fr; column-gap: 10px; }

  .rail { position: relative; padding-top: 2px; }
  .rail::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 26px; bottom: -2px;
    width: 1px;
    background: var(--line);
  }
  .slot:last-of-type .rail::before { display: none; }

  .clock {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
    color: var(--rail);
    text-align: center;
    padding: 3px 0 5px;
  }

  .pips { display: flex; gap: 4px; justify-content: center; }
  /* modificateurs préfixés : un nom nu comme .vacant hériterait des règles
     du bloc de même nom et étirerait la pastille */
  .pip {
    width: 9px; height: 9px;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    background: var(--paper);
  }
  .pip-full { background: var(--gold); }
  .pip-done { background: var(--paid); border-color: var(--paid); }
  .pip-free { border-style: dashed; border-color: var(--line); }

  .stack { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; }

  /* ---------- ligne ---------- */

  .card {
    display: grid;
    grid-template-columns: 30px 1fr auto;
    align-items: center;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: var(--shadow-1);
    padding: 8px 8px 8px 0;
    min-height: 56px;
  }
  .card.ro { grid-template-columns: 1fr auto; padding-left: 12px; }

  /* les pointillés veulent dire « rien ici » (place libre, cible de dépôt) :
     une ligne remise reste pleine, simplement estompée */
  .card.is-done { background: var(--surface-2); box-shadow: none; }
  .card.is-done .name { text-decoration: line-through; color: var(--muted); }
  .card.is-done .chip { opacity: .75; }

  .grip {
    align-self: stretch;
    background: none;
    border: 0;
    padding: 0;
    color: var(--muted);
    cursor: grab;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--r) 0 0 var(--r);
  }
  .grip:active { cursor: grabbing; background: var(--surface-2); }
  .grip svg { display: block; }

  .content { min-width: 0; display: flex; flex-direction: column; gap: 5px; padding: 2px 0; }

  .name {
    background: none;
    border: 0;
    padding: 0;
    text-align: left;
    font: inherit;
    color: inherit;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -.005em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  .name.untitled { color: var(--muted); font-weight: 400; font-style: italic; }
  .card.ro .name { cursor: default; }

  .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .chip {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 999px;
    border: 1px solid transparent;
    white-space: nowrap;
    background: none;
  }
  button.chip { cursor: pointer; }
  .chip-paid { background: var(--paid-soft); color: var(--paid); border-color: var(--paid); }
  .chip-due  { background: var(--due-soft);  color: var(--due);  border-color: var(--due); }
  /* pas de majuscules : « 21h30 » doit garder son h minuscule */
  .chip-wish { background: var(--surface-2); color: var(--muted); border-color: var(--line); text-transform: none; letter-spacing: .02em; }
  .chip-wish.late { background: var(--late-soft); color: var(--late); border-color: var(--late); }
  .chip-note {
    color: var(--muted); border-color: var(--line); background: var(--surface-2);
    text-transform: none; letter-spacing: .01em; font-family: var(--sans); font-size: 11px;
    overflow: hidden; text-overflow: ellipsis; max-width: 14ch;
  }

  .check {
    flex: none;
    width: 44px; height: 44px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .check[aria-pressed="true"] { background: var(--paid); border-color: var(--paid); color: var(--on-paid); }
  .check.ro { cursor: default; }
  .check.ro[data-done="false"] { opacity: .45; }
  .check svg { display: block; }

  /* place libre + cible de dépôt */

  .vacant {
    min-height: 56px;
    border: 1px dashed var(--line);
    border-radius: var(--r);
    background: none;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    padding-left: 14px;
  }
  .vacant:hover { border-color: var(--gold); color: var(--gold); }

  .drop {
    min-height: 56px;
    border-radius: var(--r);
    border: 1px dashed var(--gold);
    background: var(--gold-soft);
  }

  .ghost {
    position: fixed;
    z-index: 90;
    pointer-events: none;
    box-shadow: var(--shadow-2);
    transform-origin: 12% 50%;
    transform: scale(1.03) rotate(-.5deg);
    opacity: .97;
  }

  /* nommée .nobody, pas .empty : .pip.empty hériterait de son padding */
  .nobody {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    font-size: 14px;
  }
  .nobody strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

  /* ---------- ajout ---------- */

  .composer {
    position: sticky;
    bottom: 0;
    z-index: 40;
    display: flex;
    gap: 8px;
    padding: 10px var(--pad);
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--paper);
    border-top: 1px solid var(--line);
  }
  .composer input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 12px;
  }
  .composer input::placeholder { color: var(--muted); }

  /* ---------- boutons ---------- */

  button { font-family: inherit; }

  .btn {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .btn-primary { background: var(--gold); border-color: var(--gold); color: #17150F; font-weight: 700; }
  .btn-danger { color: var(--due); border-color: var(--due); background: none; }

  /* ---------- fiche d'édition ---------- */

  .scrim {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(20,19,15,.5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .scrim[hidden] { display: none; }

  .sheet {
    width: 100%;
    max-width: 560px;
    background: var(--paper);
    border-radius: 18px 18px 0 0;
    border-top: 1px solid var(--line);
    padding: 8px var(--pad) calc(18px + env(safe-area-inset-bottom, 0px));
    display: grid;
    gap: 14px;
    animation: rise .22s cubic-bezier(.2,.8,.3,1);
    max-height: 92dvh;
    overflow-y: auto;
  }
  @keyframes rise { from { transform: translateY(14px); opacity: 0; } }

  .handlebar { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 2px; }

  .sheet h2 {
    margin: 0;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .sheet h2 em { font-style: normal; color: var(--rail); }

  .field { display: grid; gap: 6px; }
  .field > span {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .field input, .field select {
    font: inherit;
    font-size: 17px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 12px;
  }
  .field select { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .hint { font-size: 12px; color: var(--muted); }
  .hint.late { color: var(--late); }

  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1;
    padding: 11px 8px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
  .seg button[data-v="paid"][aria-pressed="true"] { background: var(--paid-soft); border-color: var(--paid); color: var(--paid); }
  .seg button[data-v="due"][aria-pressed="true"]  { background: var(--due-soft);  border-color: var(--due);  color: var(--due); }
  .seg button[data-v="done"][aria-pressed="true"] { background: var(--paid-soft); border-color: var(--paid); color: var(--paid); }
  .seg button[data-v="pending"][aria-pressed="true"] { background: var(--surface-2); border-color: var(--muted); color: var(--ink); }

  .sheet-actions { display: flex; gap: 8px; }
  .sheet-actions .btn { flex: 1; }

  /* ---------- message ---------- */

  .snack {
    position: fixed;
    left: 50%;
    bottom: calc(78px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    z-index: 80;
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 999px;
    padding: 10px 10px 10px 18px;
    font-size: 13px;
    box-shadow: var(--shadow-2);
    max-width: calc(100% - 28px);
  }
  .snack[hidden] { display: none; }
  .snack button {
    background: none;
    border: 0;
    color: var(--gold);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 4px 10px;
    cursor: pointer;
    flex: none;
  }
  .snack button[hidden] { display: none; }

  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

<div class="app">
  <header class="top">
    <div class="masthead">
      <div class="wheel" aria-hidden="true"></div>
      <div>
        <span class="eyebrow" id="eyebrow">Tournée de remise</span>
        <h1>File des camemberts</h1>
      </div>
    </div>

    <div class="tally" id="tally">
      <span><b id="tallyLines">0</b><i>lignes</i></span>
      <span class="t-paid"><b id="tallyPaid">0</b><i>payées</i></span>
      <span class="t-due"><b id="tallyDue">0</b><i>à payer</i></span>
      <span><b id="tallyDone">0</b><i>remis</i></span>
      <span><b id="tallyEnd">—</b><i>fin</i></span>
    </div>

    <p class="readonly-flag" id="readonlyFlag" hidden>
      <b>Lecture seule</b>
      <span id="readonlyWhen"></span>
    </p>

    <button class="cfg-toggle" id="cfgToggle" aria-expanded="false" aria-controls="cfg">
      Réglages <span class="caret" aria-hidden="true">▾</span>
    </button>

    <div class="cfg" id="cfg" hidden>
      <div class="cfg-row">
        <label for="startTime">Premier créneau à</label>
        <input type="time" id="startTime" value="21:30">
      </div>
      <div class="cfg-row">
        <label for="perSlot">Camemberts par créneau</label>
        <input type="number" id="perSlot" min="1" max="12" step="1" value="2">
      </div>
      <div class="cfg-row">
        <label for="slotMinutes">Durée du créneau</label>
        <select id="slotMinutes">
          <option value="5">5 min</option>
          <option value="10">10 min</option>
          <option value="15" selected>15 min</option>
          <option value="20">20 min</option>
          <option value="30">30 min</option>
        </select>
      </div>
      <hr>
      <div class="cfg-actions">
        <button class="btn" id="shareBtn" type="button">Partager en lecture seule</button>
        <button class="btn" id="copyBtn" type="button">Copier ma liste (avec paiements)</button>
        <button class="btn btn-danger" id="clearBtn" type="button">Tout effacer</button>
      </div>
    </div>
  </header>

  <main class="board" id="board"></main>

  <form class="composer" id="composer">
    <input id="newName" type="text" placeholder="Ajouter un nom…" autocomplete="off" enterkeyhint="done" aria-label="Nom de la prochaine ligne">
    <button class="btn btn-primary" type="submit">Ajouter</button>
  </form>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="handlebar" aria-hidden="true"></div>
    <h2 id="sheetTitle">Modifier la ligne <em id="sheetSlot">21h30</em></h2>

    <label class="field">
      <span>Nom</span>
      <input type="text" id="editName" autocomplete="off" enterkeyhint="done">
    </label>

    <div class="field">
      <span>Heure souhaitée</span>
      <select id="editWish"></select>
      <p class="hint" id="wishHint"></p>
    </div>

    <label class="field">
      <span>Note — facultatif</span>
      <input type="text" id="editNote" autocomplete="off" placeholder="ex. 2 pièces, paie en carte">
    </label>

    <div class="field">
      <span>Paiement</span>
      <div class="seg" id="segPay">
        <button type="button" data-v="due" aria-pressed="false">À payer</button>
        <button type="button" data-v="paid" aria-pressed="false">Payé</button>
      </div>
    </div>

    <div class="field">
      <span>Remise</span>
      <div class="seg" id="segDone">
        <button type="button" data-v="pending" aria-pressed="false">En attente</button>
        <button type="button" data-v="done" aria-pressed="false">Remis</button>
      </div>
    </div>

    <div class="sheet-actions">
      <button class="btn btn-danger" type="button" id="deleteBtn">Supprimer</button>
      <button class="btn btn-primary" type="button" id="doneBtn">Enregistrer</button>
    </div>
  </div>
</div>

<div class="snack" id="snack" hidden role="status">
  <span id="snackText"></span>
  <button type="button" id="snackAction">Annuler</button>
</div>

<script>
(() => {
  "use strict";

  const KEY = "camembert-handover-v1";
  const DEFAULTS = { startTime: "21:30", perSlot: 2, slotMinutes: 15, lines: [] };
  const WISH_STEP = 15;      // l'heure souhaitée se choisit par tranches de 15 min
  const WISH_COUNT = 28;     // ~7 h de choix à partir du premier créneau

  /* ---------- état ---------- */

  let store = null;
  try {
    localStorage.setItem(KEY + "-probe", "1");
    localStorage.removeItem(KEY + "-probe");
    store = localStorage;
  } catch (e) { store = null; }

  let state = structuredClone(DEFAULTS);
  let readOnly = false;
  let snapshotAt = "";

  function normalize(l) {
    return {
      id: String(l && l.id || uid()),
      name: String(l && l.name || ""),
      note: String(l && l.note || ""),
      wish: String(l && l.wish || ""),
      paid: !!(l && l.paid),
      done: !!(l && l.done)
    };
  }
  function uid() { return Math.random().toString(36).slice(2, 10); }

  function loadLocal() {
    try {
      const raw = store && store.getItem(KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      state = Object.assign(structuredClone(DEFAULTS), parsed);
      state.lines = Array.isArray(parsed.lines) ? parsed.lines.map(normalize) : [];
    } catch (e) { /* données illisibles — on repart à vide */ }
  }

  function save() {
    if (readOnly || !store) return;   // un instantané ne doit jamais écraser la file
    try { store.setItem(KEY, JSON.stringify(state)); } catch (e) { /* quota — on continue en mémoire */ }
  }

  /* ---------- heures ---------- */

  function startMinutes() {
    const m = /^(\d{1,2}):(\d{2})$/.exec(state.startTime || "21:30");
    if (!m) return 21 * 60 + 30;
    return (Number(m[1]) % 24) * 60 + (Number(m[2]) % 60);
  }
  function fmt(total) {                       // « 21h30 »
    const t = ((total % 1440) + 1440) % 1440;
    return String(Math.floor(t / 60)).padStart(2, "0") + "h" + String(t % 60).padStart(2, "0");
  }
  function toMinutes(hhmm) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || "");
    return m ? (Number(m[1]) % 24) * 60 + (Number(m[2]) % 60) : null;
  }
  function slotOf(i) { return Math.floor(i / state.perSlot); }
  function slotMinutesAt(i) { return startMinutes() + slotOf(i) * state.slotMinutes; }
  function slotTime(slotIndex) { return fmt(startMinutes() + slotIndex * state.slotMinutes); }

  // décalage entre l'heure réelle (issue de l'ordre) et l'heure souhaitée
  function delay(line, index) {
    const wish = toMinutes(line.wish);
    if (wish == null) return null;
    return slotMinutesAt(index) - wish;
  }

  /* ---------- instantané partagé (sans paiements) ---------- */

  function b64urlEncode(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = "";
    bytes.forEach(b => { bin += String.fromCharCode(b); });
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function b64urlDecode(s) {
    const pad = s.replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(pad + "=".repeat((4 - pad.length % 4) % 4));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }

  function nowHHMM() {
    const d = new Date();
    return fmt(d.getHours() * 60 + d.getMinutes());
  }

  // le paiement n'est jamais encodé : il ne doit pas voyager avec le lien
  function snapshotPayload() {
    return {
      v: 1,
      t: state.startTime,
      p: state.perSlot,
      m: state.slotMinutes,
      at: nowHHMM(),
      l: state.lines.map(l => ({ n: l.name, o: l.note, w: l.wish, d: l.done ? 1 : 0 }))
    };
  }

  function readSnapshot() {
    const src = location.hash.slice(1) || location.search.slice(1);
    const m = /(?:^|&)s=([A-Za-z0-9\-_]+)/.exec(src);
    if (!m) return false;
    try {
      const p = JSON.parse(b64urlDecode(m[1]));
      if (!p || !Array.isArray(p.l)) return false;
      state = {
        startTime: String(p.t || "21:30"),
        perSlot: Math.max(1, Math.min(12, Number(p.p) || 2)),
        slotMinutes: Number(p.m) || 15,
        lines: p.l.map(x => normalize({ name: x.n, note: x.o, wish: x.w, done: !!x.d }))
      };
      snapshotAt = String(p.at || "");
      readOnly = true;
      return true;
    } catch (e) { return false; }
  }

  // vrai lien partageable ? faux dans une iframe étrangère (la page publiée),
  // où l'URL visible n'est pas celle de ce document
  function canShareLink() {
    try {
      return window.self === window.top && /^https?:$/.test(location.protocol);
    } catch (e) { return false; }
  }

  function snapshotUrl() {
    const base = location.href.split("#")[0].split("?")[0];
    return base + "#s=" + b64urlEncode(JSON.stringify(snapshotPayload()));
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }

  // page autonome, lisible hors ligne, sans paiements
  function snapshotFile() {
    const rows = state.lines.map((l, i) => {
      const d = delay(l, i);
      const wish = l.wish
        ? '<em class="w' + (d != null && d > 0 ? " late" : "") + '">souhait ' + esc(fmt(toMinutes(l.wish)))
          + (d != null && d > 0 ? " · +" + d + " min" : "") + "</em>"
        : "";
      return '<li class="' + (l.done ? "done" : "") + '"><b>' + esc(fmt(slotMinutesAt(i))) + "</b><span>"
        + esc(l.name || "Sans nom") + (l.done ? ' <i class="t">remis</i>' : "")
        + (l.note ? '<em class="n">' + esc(l.note) + "</em>" : "") + wish + "</span></li>";
    }).join("");

    return '<!doctype html><html lang="fr"><head><meta charset="utf-8">'
      + '<meta name="viewport" content="width=device-width,initial-scale=1">'
      + "<title>File des camemberts</title><style>"
      + ":root{color-scheme:light dark;--bg:#F7F5F0;--fg:#1C1B17;--mu:#6E695C;--ln:#DED7C7;--sf:#fff;--ra:#2E4A7D;--pd:#3C7550;--lt:#96590C}"
      + "@media(prefers-color-scheme:dark){:root{--bg:#14130F;--fg:#F0EBDE;--mu:#9D9687;--ln:#38352B;--sf:#1D1B16;--ra:#94ADD8;--pd:#7CBB8B;--lt:#E3B072}}"
      + "body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:20px 14px}"
      + "main{max-width:560px;margin:0 auto}h1{font-size:20px;text-transform:uppercase;letter-spacing:.01em;margin:0 0 4px}"
      + "p.sub{margin:0 0 18px;color:var(--mu);font-size:13px}"
      + "ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}"
      + "li{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}"
      + "li.done{opacity:.62}li.done span>span,li.done b{text-decoration:none}"
      + "b{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;color:var(--ra);font-size:14px}"
      + "span{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;min-width:0;font-weight:600}"
      + "em{font-style:normal;font-weight:400;font-size:11px;color:var(--mu);border:1px solid var(--ln);border-radius:99px;padding:2px 7px}"
      + "em.w.late{color:var(--lt);border-color:var(--lt)}i.t{font-style:normal;font-size:11px;color:var(--pd);font-weight:700;text-transform:uppercase}"
      + "footer{margin-top:20px;color:var(--mu);font-size:12px;text-align:center}"
      + "</style></head><body><main><h1>File des camemberts</h1>"
      + '<p class="sub">Instantané de ' + esc(snapshotAt || nowHHMM()) + " · premier créneau "
      + esc(fmt(startMinutes())) + " · " + esc(String(state.perSlot)) + " par "
      + esc(String(state.slotMinutes)) + " min</p><ul>" + rows + "</ul>"
      + "<footer>Vue en lecture seule. Les heures affichées suivent l'ordre au moment de l'instantané.</footer>"
      + "</main></body></html>";
  }

  function publicText() {
    const rows = state.lines.map((l, i) => {
      const d = delay(l, i);
      return fmt(slotMinutesAt(i)) + "  " + (l.name || "Sans nom")
        + (l.done ? " — remis" : "")
        + (l.note ? " (" + l.note + ")" : "")
        + (l.wish ? " [souhait " + fmt(toMinutes(l.wish)) + (d != null && d > 0 ? ", +" + d + " min" : "") + "]" : "");
    });
    return "File des camemberts — instantané de " + (snapshotAt || nowHHMM())
      + ", premier créneau " + fmt(startMinutes()) + ", " + state.perSlot + " par "
      + state.slotMinutes + " min\n" + rows.join("\n");
  }

  function privateText() {
    const rows = state.lines.map((l, i) => {
      const d = delay(l, i);
      return fmt(slotMinutesAt(i)) + "  " + (l.name || "Sans nom")
        + " — " + (l.paid ? "payé" : "à payer")
        + (l.done ? " — remis" : "")
        + (l.note ? " (" + l.note + ")" : "")
        + (l.wish ? " [souhait " + fmt(toMinutes(l.wish)) + (d != null && d > 0 ? ", +" + d + " min" : "") + "]" : "");
    });
    return "File des camemberts — premier créneau " + fmt(startMinutes())
      + ", " + state.perSlot + " par " + state.slotMinutes + " min\n" + rows.join("\n");
  }

  /* ---------- éléments ---------- */

  const board = document.getElementById("board");
  const scrim = document.getElementById("scrim");
  const snack = document.getElementById("snack");
  const snackText = document.getElementById("snackText");
  const snackAction = document.getElementById("snackAction");
  const newName = document.getElementById("newName");
  const composer = document.getElementById("composer");

  const GRIP = '<svg width="12" height="20" viewBox="0 0 12 20" fill="currentColor" aria-hidden="true">'
    + '<circle cx="3" cy="4" r="1.5"/><circle cx="9" cy="4" r="1.5"/>'
    + '<circle cx="3" cy="10" r="1.5"/><circle cx="9" cy="10" r="1.5"/>'
    + '<circle cx="3" cy="16" r="1.5"/><circle cx="9" cy="16" r="1.5"/></svg>';

  const TICK = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" '
    + 'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<path d="M4 10.5 8 14.5 16 6"/></svg>';

  const drag = { id: null, target: -1, ghost: null, dy: 0, dx: 0, scroll: 0, raf: 0 };

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  /* ---------- rendu ---------- */

  function render() {
    const lines = state.lines;
    const seq = drag.id ? lines.filter(l => l.id !== drag.id) : lines.slice();
    const perSlot = Math.max(1, Math.min(12, Number(state.perSlot) || 2));

    const positions = seq.map(l => ({ kind: "line", line: l }));
    if (drag.id) positions.splice(clamp(drag.target, 0, seq.length), 0, { kind: "drop" });

    if (!readOnly) {
      const free = positions.length === 0 ? perSlot : (perSlot - (positions.length % perSlot)) % perSlot;
      for (let i = 0; i < free; i++) positions.push({ kind: "vacant" });
    }

    board.textContent = "";

    if (lines.length === 0 && !drag.id) {
      const none = document.createElement("p");
      none.className = "nobody";
      none.innerHTML = readOnly
        ? "<strong>La file est vide.</strong>Aucun nom au moment de l'instantané."
        : "<strong>Personne dans la file.</strong>Ajoutez un nom ci-dessous — chaque créneau de "
          + state.slotMinutes + " minutes prend " + perSlot
          + (perSlot === 1 ? " camembert." : " camemberts.");
      board.appendChild(none);
      updateTally();
      return;
    }

    const slots = Math.ceil(positions.length / perSlot);
    let cursor = 0;
    for (let s = 0; s < slots; s++) {
      const group = positions.slice(s * perSlot, s * perSlot + perSlot);
      board.appendChild(renderSlot(s, group, cursor));
      cursor += group.length;
    }
    updateTally();
  }

  function renderSlot(index, group, firstPos) {
    const slot = document.createElement("section");
    slot.className = "slot";

    const rail = document.createElement("div");
    rail.className = "rail";

    const clock = document.createElement("div");
    clock.className = "clock";
    clock.textContent = slotTime(index);
    rail.appendChild(clock);

    const pips = document.createElement("div");
    pips.className = "pips";
    group.forEach(pos => {
      const pip = document.createElement("span");
      pip.className = "pip " + (pos.kind === "line" ? (pos.line.done ? "pip-done" : "pip-full")
                             : pos.kind === "drop" ? "pip-full" : "pip-free");
      pips.appendChild(pip);
    });
    rail.appendChild(pips);
    slot.appendChild(rail);

    const stack = document.createElement("div");
    stack.className = "stack";
    group.forEach((pos, i) => {
      if (pos.kind === "line") stack.appendChild(renderCard(pos.line, firstPos + i));
      else if (pos.kind === "drop") {
        const d = document.createElement("div");
        d.className = "drop";
        stack.appendChild(d);
      } else {
        const v = document.createElement("button");
        v.type = "button";
        v.className = "vacant";
        v.textContent = "Libre";
        v.addEventListener("click", () => newName.focus());
        stack.appendChild(v);
      }
    });
    slot.appendChild(stack);
    return slot;
  }

  function renderCard(line, position) {
    const card = document.createElement("article");
    card.className = "card" + (line.done ? " is-done" : "") + (readOnly ? " ro" : "");
    card.dataset.id = line.id;

    if (!readOnly) {
      const grip = document.createElement("button");
      grip.type = "button";
      grip.className = "grip";
      grip.setAttribute("aria-label", "Réordonner " + (line.name || "ligne sans nom"));
      grip.innerHTML = GRIP;
      grip.addEventListener("pointerdown", e => startDrag(e, line.id, card));
      card.appendChild(grip);
    }

    const content = document.createElement("div");
    content.className = "content";

    const name = document.createElement(readOnly ? "div" : "button");
    name.className = "name" + (line.name ? "" : " untitled");
    name.textContent = line.name || "Sans nom";
    if (!readOnly) {
      name.type = "button";
      name.setAttribute("aria-label", "Modifier " + (line.name || "ligne sans nom"));
      name.addEventListener("click", () => openSheet(line.id));
    }
    content.appendChild(name);

    const meta = document.createElement("div");
    meta.className = "meta";

    // le paiement se change d'une touche, et ne figure jamais en lecture seule
    if (!readOnly) {
      const pay = document.createElement("button");
      pay.type = "button";
      pay.className = "chip " + (line.paid ? "chip-paid" : "chip-due");
      pay.textContent = line.paid ? "Payé" : "À payer";
      pay.setAttribute("aria-label",
        (line.paid ? "Marquer comme à payer : " : "Marquer comme payé : ") + (line.name || "ligne sans nom"));
      pay.addEventListener("click", () => {
        line.paid = !line.paid;
        save();
        render();
      });
      meta.appendChild(pay);
    }

    if (line.wish) {
      const d = delay(line, position);
      const wish = document.createElement("span");
      wish.className = "chip chip-wish" + (d != null && d > 0 ? " late" : "");
      wish.textContent = "souhait " + fmt(toMinutes(line.wish)) + (d != null && d > 0 ? " · +" + d + " min" : "");
      meta.appendChild(wish);
    }

    if (line.note) {
      const note = document.createElement("span");
      note.className = "chip chip-note";
      note.textContent = line.note;
      meta.appendChild(note);
    }

    if (meta.childNodes.length) content.appendChild(meta);
    card.appendChild(content);

    const check = document.createElement(readOnly ? "div" : "button");
    check.className = "check" + (readOnly ? " ro" : "");
    check.innerHTML = TICK;
    if (readOnly) {
      check.dataset.done = String(line.done);
      check.setAttribute("role", "img");
      check.setAttribute("aria-label", line.done ? "Remis" : "En attente");
      if (line.done) check.setAttribute("aria-pressed", "true");
      check.style.background = line.done ? "var(--paid)" : "var(--surface-2)";
      check.style.color = line.done ? "var(--on-paid)" : "var(--line)";
      check.style.borderColor = line.done ? "var(--paid)" : "var(--line)";
    } else {
      check.type = "button";
      check.setAttribute("aria-pressed", String(line.done));
      check.setAttribute("aria-label",
        (line.done ? "Marquer en attente : " : "Marquer comme remis : ") + (line.name || "ligne sans nom"));
      check.addEventListener("click", () => {
        line.done = !line.done;
        save();
        render();
      });
    }
    card.appendChild(check);

    return card;
  }

  function updateTally() {
    const n = state.lines.length;
    const paid = state.lines.filter(l => l.paid).length;
    const done = state.lines.filter(l => l.done).length;
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    set("tallyLines", n);
    set("tallyPaid", paid);          // absents en lecture seule
    set("tallyDue", n - paid);
    set("tallyDone", done);
    set("tallyEnd", n ? slotTime(slotOf(n - 1)) : "—");
  }

  /* ---------- glisser-déposer (pointer events : tactile et souris) ---------- */

  function startDrag(e, id, card) {
    if (readOnly) return;
    if (e.button != null && e.button !== 0) return;
    e.preventDefault();

    const index = state.lines.findIndex(l => l.id === id);
    if (index < 0) return;

    const rect = card.getBoundingClientRect();
    drag.id = id;
    drag.target = index;
    drag.dx = e.clientX - rect.left;
    drag.dy = e.clientY - rect.top;

    const ghost = card.cloneNode(true);
    ghost.classList.add("ghost");
    ghost.style.width = rect.width + "px";
    ghost.style.left = "0px";
    ghost.style.top = "0px";
    document.body.appendChild(ghost);
    drag.ghost = ghost;
    moveGhost(e.clientX, e.clientY);

    document.body.classList.add("is-dragging");

    // capture sur <body>, pas sur la poignée : chaque rendu reconstruit le
    // tableau et détruirait la poignée en plein glissement
    try { document.body.setPointerCapture(e.pointerId); } catch (err) { /* souris sans capture */ }
    document.body.addEventListener("pointermove", onDragMove);
    document.body.addEventListener("pointerup", onDragEnd);
    document.body.addEventListener("pointercancel", onDragEnd);

    render();
  }

  function moveGhost(x, y) {
    if (!drag.ghost) return;
    drag.ghost.style.transform =
      "translate(" + (x - drag.dx) + "px," + (y - drag.dy) + "px) scale(1.03) rotate(-.5deg)";
  }

  function onDragMove(e) {
    if (!drag.id) return;
    e.preventDefault();
    moveGhost(e.clientX, e.clientY);

    const edge = 90;
    if (e.clientY < edge) drag.scroll = -Math.ceil((edge - e.clientY) / 6);
    else if (e.clientY > window.innerHeight - edge) drag.scroll = Math.ceil((e.clientY - (window.innerHeight - edge)) / 6);
    else drag.scroll = 0;
    if (drag.scroll && !drag.raf) drag.raf = requestAnimationFrame(autoScroll);

    updateTarget(e.clientY);
  }

  function autoScroll() {
    drag.raf = 0;
    if (!drag.id || !drag.scroll) return;
    window.scrollBy(0, drag.scroll);
    drag.raf = requestAnimationFrame(autoScroll);
  }

  function updateTarget(clientY) {
    const cards = Array.from(board.querySelectorAll(".card"));
    let index = 0;
    for (const el of cards) {
      const r = el.getBoundingClientRect();
      if (clientY > r.top + r.height / 2) index++;
    }
    if (index !== drag.target) {
      drag.target = index;
      render();
    }
  }

  function onDragEnd(e) {
    document.body.removeEventListener("pointermove", onDragMove);
    document.body.removeEventListener("pointerup", onDragEnd);
    document.body.removeEventListener("pointercancel", onDragEnd);
    try { document.body.releasePointerCapture(e.pointerId); } catch (err) { /* déjà relâché */ }

    if (drag.ghost) drag.ghost.remove();
    document.body.classList.remove("is-dragging");
    drag.scroll = 0;

    const id = drag.id, target = drag.target;
    drag.id = null; drag.ghost = null; drag.target = -1;

    const from = state.lines.findIndex(l => l.id === id);
    if (from >= 0) {
      const [moved] = state.lines.splice(from, 1);
      state.lines.splice(clamp(target, 0, state.lines.length), 0, moved);
      save();
    }
    render();
  }

  /* ---------- fiche d'édition ---------- */

  let editingId = null;
  const editName = document.getElementById("editName");
  const editNote = document.getElementById("editNote");
  const editWish = document.getElementById("editWish");
  const wishHint = document.getElementById("wishHint");
  const segPay = document.getElementById("segPay");
  const segDone = document.getElementById("segDone");

  function currentLine() { return state.lines.find(l => l.id === editingId) || null; }

  // les choix d'heure souhaitée partent du premier créneau réglé, par pas de 15 min
  function fillWishOptions(selected) {
    const base = startMinutes();
    editWish.textContent = "";
    const none = document.createElement("option");
    none.value = "";
    none.textContent = "Aucune préférence";
    editWish.appendChild(none);

    let hasSelected = !selected;
    for (let i = 0; i < WISH_COUNT; i++) {
      const total = base + i * WISH_STEP;
      const value = String(Math.floor(((total % 1440) + 1440) % 1440 / 60)).padStart(2, "0")
        + ":" + String(total % 60).padStart(2, "0");
      const opt = document.createElement("option");
      opt.value = value;
      opt.textContent = fmt(total);
      if (value === selected) hasSelected = true;
      editWish.appendChild(opt);
    }
    // une heure enregistrée avant un changement de réglage doit rester choisissable
    if (!hasSelected) {
      const opt = document.createElement("option");
      opt.value = selected;
      opt.textContent = fmt(toMinutes(selected));
      editWish.appendChild(opt);
    }
    editWish.value = selected || "";
  }

  function paintWishHint() {
    const line = currentLine();
    if (!line) return;
    const index = state.lines.indexOf(line);
    const d = delay(line, index);
    if (d == null) {
      wishHint.className = "hint";
      wishHint.textContent = "Remise prévue à " + fmt(slotMinutesAt(index)) + " selon l'ordre actuel.";
    } else if (d > 0) {
      wishHint.className = "hint late";
      wishHint.textContent = "Remise prévue à " + fmt(slotMinutesAt(index)) + " — " + d
        + " min après le souhait. Remontez la ligne pour la rapprocher.";
    } else {
      wishHint.className = "hint";
      wishHint.textContent = "Remise prévue à " + fmt(slotMinutesAt(index))
        + (d === 0 ? " — pile à l'heure souhaitée." : " — " + (-d) + " min avant le souhait.");
    }
  }

  function paintSegs() {
    const line = currentLine();
    if (!line) return;
    segPay.querySelectorAll("button").forEach(b =>
      b.setAttribute("aria-pressed", String((b.dataset.v === "paid") === line.paid)));
    segDone.querySelectorAll("button").forEach(b =>
      b.setAttribute("aria-pressed", String((b.dataset.v === "done") === line.done)));
  }

  function openSheet(id) {
    if (readOnly) return;
    editingId = id;
    const line = currentLine();
    if (!line) return;
    editName.value = line.name;
    editNote.value = line.note;
    fillWishOptions(line.wish);
    document.getElementById("sheetSlot").textContent = fmt(slotMinutesAt(state.lines.indexOf(line)));
    paintSegs();
    paintWishHint();
    scrim.hidden = false;
    setTimeout(() => editName.focus(), 60);
  }

  function commitSheet() {
    const line = currentLine();
    if (!line) return;
    line.name = editName.value.trim();
    line.note = editNote.value.trim();
    line.wish = editWish.value;
    save();
    render();
  }

  function closeSheet() {
    commitSheet();
    scrim.hidden = true;
    editingId = null;
  }

  editWish.addEventListener("change", () => {
    const line = currentLine();
    if (!line) return;
    line.wish = editWish.value;
    save();
    render();
    paintWishHint();
  });

  segPay.addEventListener("click", e => {
    const b = e.target.closest("button");
    const line = currentLine();
    if (!b || !line) return;
    line.paid = b.dataset.v === "paid";
    paintSegs();
    save();
    render();
  });

  segDone.addEventListener("click", e => {
    const b = e.target.closest("button");
    const line = currentLine();
    if (!b || !line) return;
    line.done = b.dataset.v === "done";
    paintSegs();
    save();
    render();
  });

  document.getElementById("doneBtn").addEventListener("click", closeSheet);
  scrim.addEventListener("click", e => { if (e.target === scrim) closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !scrim.hidden) closeSheet(); });
  editName.addEventListener("keydown", e => { if (e.key === "Enter") closeSheet(); });
  editNote.addEventListener("keydown", e => { if (e.key === "Enter") closeSheet(); });

  document.getElementById("deleteBtn").addEventListener("click", () => {
    const line = currentLine();
    if (!line) return;
    const index = state.lines.indexOf(line);
    state.lines.splice(index, 1);
    scrim.hidden = true;
    editingId = null;
    save();
    render();
    showSnack("Supprimé : " + (line.name || "ligne sans nom"), "Annuler", () => {
      state.lines.splice(Math.min(index, state.lines.length), 0, line);
      save();
      render();
    });
  });

  /* ---------- message ---------- */

  let snackTimer = 0, snackFn = null;

  function showSnack(text, label, fn) {
    snackText.textContent = text;
    snackAction.textContent = label || "";
    snackAction.hidden = !fn;
    snackFn = fn || null;
    snack.hidden = false;
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => { snack.hidden = true; snackFn = null; }, 6000);
  }

  snackAction.addEventListener("click", () => {
    if (snackFn) snackFn();
    snack.hidden = true;
    snackFn = null;
  });

  /* ---------- presse-papiers ---------- */

  async function copy(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (err) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      ta.remove();
      return ok;
    }
  }

  /* ---------- ajout ---------- */

  composer.addEventListener("submit", e => {
    e.preventDefault();
    const name = newName.value.trim();
    if (!name) { newName.focus(); return; }
    state.lines.push(normalize({ id: uid(), name }));
    newName.value = "";
    save();
    render();
    newName.focus();
  });

  /* ---------- réglages ---------- */

  const cfg = document.getElementById("cfg");
  const cfgToggle = document.getElementById("cfgToggle");
  const startTime = document.getElementById("startTime");
  const perSlot = document.getElementById("perSlot");
  const slotMinutes = document.getElementById("slotMinutes");

  cfgToggle.addEventListener("click", () => {
    const open = cfg.hidden;
    cfg.hidden = !open;
    cfgToggle.setAttribute("aria-expanded", String(open));
  });

  startTime.addEventListener("change", () => {
    state.startTime = startTime.value || "21:30";
    save();
    render();
  });
  perSlot.addEventListener("change", () => {
    state.perSlot = clamp(Number(perSlot.value) || 2, 1, 12);
    perSlot.value = state.perSlot;
    save();
    render();
  });
  slotMinutes.addEventListener("change", () => {
    state.slotMinutes = Number(slotMinutes.value) || 15;
    save();
    render();
  });

  document.getElementById("copyBtn").addEventListener("click", async () => {
    showSnack(await copy(privateText())
      ? "Liste copiée — elle contient les paiements."
      : "Copie bloquée ici — faites une capture d'écran.", "", null);
  });

  document.getElementById("shareBtn").addEventListener("click", async () => {
    if (!state.lines.length) { showSnack("La file est vide — rien à partager.", "", null); return; }
    snapshotAt = nowHHMM();

    // une vraie URL n'est partageable que hors iframe étrangère
    if (canShareLink()) {
      showSnack(await copy(snapshotUrl())
        ? "Lien copié — lecture seule, sans les paiements."
        : "Copie bloquée ici — essayez le fichier.", "", null);
      return;
    }

    const dl = window.claude && window.claude.downloads;
    if (!dl) {
      showSnack(await copy(publicText())
        ? "Liste copiée — sans les paiements."
        : "Partage indisponible ici.", "", null);
      return;
    }

    try {
      await dl.save({ filename: "file-camemberts.html", data: snapshotFile() });
      showSnack("Fichier enregistré — envoyez-le à qui vous voulez.", "", null);
    } catch (err) {
      const code = err && err.code;
      if (code === "declined") { showSnack("Partage annulé.", "", null); return; }
      if (code === "rate_limited") { showSnack("Trop de demandes — réessayez dans un instant.", "", null); return; }
      // html fait partie du jeu étendu : il peut être refusé, on retombe sur le texte
      showSnack(await copy(publicText())
        ? "Liste copiée — sans les paiements."
        : "Partage indisponible ici.", "", null);
    }
  });

  let armed = false;
  const clearBtn = document.getElementById("clearBtn");
  clearBtn.addEventListener("click", () => {
    if (!armed) {
      armed = true;
      clearBtn.textContent = "Appuyez encore pour effacer";
      setTimeout(() => { armed = false; clearBtn.textContent = "Tout effacer"; }, 4000);
      return;
    }
    const backup = state.lines;
    state.lines = [];
    armed = false;
    clearBtn.textContent = "Tout effacer";
    save();
    render();
    showSnack("File effacée", "Annuler", () => {
      state.lines = backup;
      save();
      render();
    });
  });

  /* ---------- démarrage ---------- */

  if (!readSnapshot()) loadLocal();

  if (readOnly) {
    document.getElementById("readonlyFlag").hidden = false;
    document.getElementById("readonlyWhen").textContent =
      "Instantané de " + (snapshotAt || "l'ordre partagé") + " · les changements faits depuis n'apparaissent pas.";
    document.getElementById("eyebrow").textContent = "Ordre partagé";

    // on retire ces blocs du document plutôt que de les masquer : le mot
    // « payé » ne doit figurer nulle part dans la page d'un lecteur
    document.querySelectorAll(".tally .t-paid, .tally .t-due").forEach(el => el.remove());
    [cfg, cfgToggle, composer, scrim].forEach(el => el.remove());
  } else {
    startTime.value = state.startTime;
    perSlot.value = state.perSlot;
    slotMinutes.value = String(state.slotMinutes);
  }

  render();
})();
</script>

</body>
</html>
